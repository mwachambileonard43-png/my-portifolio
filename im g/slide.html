<!-- Replace your single <img> with this block -->
<div class="slideshow">
  <img class="slide active" src="image1.jpg" alt="Slide 1">
  <img class="slide" src="image2.jpg" alt="Slide 2">
  <img class="slide" src="image3.jpg" alt="Slide 3">
</div>

<style>
  .slideshow {
    position: relative;
    width: 100%;
    max-width: 800px; /* adjust to your layout */
    height: 400px;   /* adjust height as needed */
    overflow: hidden;
  }
  .slideshow img {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 1s ease-in-out;
  }
  .slideshow img.active {
    opacity: 1;
  }
</style>

<script>
  const slides = document.querySelectorAll('.slideshow .slide');
  let index = 0;
  setInterval(() => {
    slides[index].classList.remove('active');
    index = (index + 1) % slides.length;
    slides[index].classList.add('active');
  }, 15000); // 15000ms = 15s
</script>
